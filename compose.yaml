services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow_local
      POSTGRES_DB: workflow
    ports:
      - '127.0.0.1:${WORKFLOW_POSTGRES_PORT:-0}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workflow -d workflow']
      interval: 1s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${WORKFLOW_REDIS_PORT:-0}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
